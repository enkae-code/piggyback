<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kit probe: slow same-host replacement during the scroll page's settle wait</title>
</head>
<body style="margin: 0">
<main style="min-height: 3200px">
  <h1>Slow replacement during settle probe</h1>
</main>
<!-- Second load in the context (the scroll page): 500 ms after load, inside the settle wait, move to
     a same-host document that stalls for 20 s before it finishes loading. -->
<script>
  if (localStorage.getItem('loaded')) {
    addEventListener('load', function () {
      setTimeout(function () { location.href = '/slow-document'; }, 500);
    });
  } else {
    localStorage.setItem('loaded', '1');
  }
</script>
</body>
</html>
