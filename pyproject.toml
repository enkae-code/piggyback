[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piggyback-design"
version = "0.2.0"
description = "Measure a page's design fingerprint and keep reference files in spec v1."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
measure = ["playwright>=1.47"]

[project.scripts]
piggyback = "piggyback.cli:main"
# uvx runs the script named after the package
piggyback-design = "piggyback.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["piggyback"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
