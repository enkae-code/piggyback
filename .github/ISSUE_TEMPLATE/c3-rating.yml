name: C3 rating
description: Submit one packet of blind design-match picks (C3).
title: "[C3 rating] "
labels: ["c3-rating"]
body:
  - type: markdown
    attributes:
      value: "Rate one packet at https://enkae-code.github.io/piggyback/bench/c3/rate/ (about 15 minutes). Judge only design match to the original's direction, not preference."
  - type: dropdown
    id: packet
    attributes:
      label: Packet
      options:
        - P1
        - P2
        - P3
        - P4
        - P5
        - P6
    validations:
      required: true
  - type: dropdown
    id: item-1
    attributes:
      label: Item 1
      description: Which page looks more like the original's design direction for this item?
      options:
        - A
        - B
    validations:
      required: true
  - type: input
    id: evidence-1
    attributes:
      label: Item 1 evidence
      description: One line, why this page matches the design direction.
    validations:
      required: true
